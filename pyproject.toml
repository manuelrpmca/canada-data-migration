[project]
name = "canada-data-migration"
version = "0.0.0"
description = "Ingest Canadian open data, migrate it from a legacy database to cloud warehouses, and prove it arrived intact."
readme = "README.md"
license = "MIT"
authors = [{ name = "Manuel Pérez" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
cdm = "cdm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
